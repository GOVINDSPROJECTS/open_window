# TURN server configuration

listening-port=3478
tls-listening-port=5349

realm=open-window.local
server-name=open-window-turn

# Use long-term credential mechanism
lt-cred-mech

# Authentication secret (should match backend generation)
use-auth-secret
static-auth-secret=ReplaceWithSecureSecretInProduction

# Logs
log-file=stdout
simple-log

# Ports for relaying
min-port=49152
max-port=65535
