version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: open-window-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: open_window
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: open-window-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  turn:
    image: coturn/coturn
    container_name: open-window-turn
    restart: always
    volumes:
      - ./turn-service/turnserver.conf:/etc/coturn/turnserver.conf
    network_mode: host # Often needed for TURN to work properly with port ranges

volumes:
  postgres_data:
  redis_data:
